#!/usr/bin/env bash
# newproject.conf — token values for ONE project. Copy it, edit the values, then:
#     ./init.sh <target-repo-dir> <this-file>
#
# HOW TO READ THIS FILE
#   * Lines starting with `#>` are the TRIM (patch-minimizer) values, left in as
#     REFERENCE EXAMPLES. Uncomment/adapt the ones you want, or replace with your own.
#   * Un-prefixed assignments below are GENERIC defaults that suit most projects.
#   * Single-line tokens are plain "VAR=...". Multi-line tokens use a quoted heredoc
#     ( VAR="$(cat <<'EOF' ... EOF)" ) so their text is stored verbatim.
#   * Any token you leave commented renders as an empty section — fine while drafting,
#     but SERVICE_NAME and SYSTEM_PACKAGES must be set before the image will build.
#   * YAML blocks (VOLUMES, COMPOSE_ENV, WATCH) MUST keep their leading indentation
#     (6 spaces for list items, 8 under watch:); Dockerfile blocks start at column 0.

# ─── single-line tokens ──────────────────────────────────────────────────────

# GENERIC — safe to keep as-is for most projects:
BASE_IMAGE="nestybox/ubuntu-jammy-systemd-docker"  # sysbox base image
WORKDIR="/app"                                     # working dir inside the container
ENV_FILE="./dev.env"                               # host file of secrets/keys, injected as env

# PROJECT — set these for your project (required):
SERVICE_NAME=""        # docker-compose service name (any label)
SYSTEM_PACKAGES=""     # apt packages (language runtime, build tools), one line
#> SERVICE_NAME="minimizer"
#> SYSTEM_PACKAGES="python3.10 python3-pip python3.10-venv git curl"

# ─── Dockerfile blocks (column 0, no indentation) ────────────────────────────

# @@DEP_INSTALL@@ — copy your dependency manifest, then install. Its own Docker layer,
# so it stays cached until the manifest changes.
DEP_INSTALL=""
#> DEP_INSTALL="$(cat <<'EOF'
#> COPY pyproject.toml ./
#> COPY src/ ./src/
#> # Upgrade build tooling first: the base image's setuptools predates PEP 621 (<61), so it
#> # can't read [project] and the package builds as "UNKNOWN" (then [swebench] extras fail).
#> # With a modern setuptools, ".[swebench]" resolves the name + extras directly.
#> RUN pip install --no-cache-dir -U pip setuptools wheel \
#>  && pip install --no-cache-dir ".[swebench]"
#> EOF
#> )"

# @@PROJECT_COPY@@ — copy the rest of your app into the image. One COPY per line.
# (docker/ is copied by the template's [GENERIC] shell step, so do NOT list it here.)
PROJECT_COPY=""
#> PROJECT_COPY="$(cat <<'EOF'
#> COPY test_swebench_minimization.py ./
#> COPY CLAUDE.md ./
#> COPY AGENTS.md ./
#> COPY .claude/ ./.claude/
#> COPY claude_plans/ ./claude_plans/
#> COPY .dockerignore ./
#> COPY Dockerfile ./
#> COPY Dockerfile.sysbox ./
#> COPY README.md ./
#> COPY docker-compose.sysbox.yml ./
#> COPY docker-compose.yml ./
#> COPY .git ./.git
#> EOF
#> )"

# @@ENV_VARS@@ — Dockerfile ENV lines (baked into the image). One ENV per line.
# Saved into the image at `docker-compose build` (baked in; available to RUN steps and
# to the image however it is later launched).
ENV_VARS=""
#> ENV_VARS="$(cat <<'EOF'
#> ENV KAGENT_PATH=/app
#> ENV PYTHONPATH=/app/src:/app
#> EOF
#> )"

# ─── compose blocks (KEEP the leading YAML indentation) ──────────────────────

# @@VOLUMES@@ — host↔container bind mounts. 6-space indent; "host:container[:ro]".
# The generic sysbox-docker-store mount is already in the template — do NOT repeat it.
VOLUMES=""
#> VOLUMES="$(cat <<'EOF'
#>       - ./results/swe-bench-workspace:/app/results/swe-bench-workspace
#>       - ./results/swe-bench-swe-agent-trajs:/app/results/swe-bench-swe-agent-trajs:ro
#>       - ./output:/app/output
#> EOF
#> )"

# @@COMPOSE_ENV@@ — runtime env vars under `environment:`. 6-space indent, "- KEY=VAL".
# Applied at `docker-compose run`/`up` (set only for containers started via this compose
# file; overrides an ENV of the same name baked in at build).
COMPOSE_ENV=""
#> COMPOSE_ENV="$(cat <<'EOF'
#>       - KAGENT_PATH=/app
#>       - PYTHONPATH=/app/src:/app
#> EOF
#> )"

# @@WATCH@@ — `docker compose watch` rules. 8-space indent. action: sync (live-copy a
# path into the running container) or rebuild (re-build the image when a file changes).
WATCH=""
#> WATCH="$(cat <<'EOF'
#>         - action: sync
#>           path: ./src
#>           target: /app/src
#>         - action: sync
#>           path: ./CLAUDE.md
#>           target: /app/CLAUDE.md
#>         - action: sync
#>           path: ./AGENTS.md
#>           target: /app/AGENTS.md
#>         - action: sync
#>           path: ./test_swebench_minimization.py
#>           target: /app/test_swebench_minimization.py
#>         - action: sync
#>           path: ./.claude
#>           target: /app/.claude
#>         - action: sync
#>           path: ./claude_plans
#>           target: /app/claude_plans
#>         - action: sync
#>           path: ./docker
#>           target: /app/docker
#>         - action: rebuild
#>           path: ./pyproject.toml
#> EOF
#> )"
